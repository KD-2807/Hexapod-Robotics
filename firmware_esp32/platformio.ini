; Firmware hexapod - ESP32-WROOM + 2x PCA9685 + MPU6050.
;   pio run -t upload        nạp firmware (cần ESP32 nối USB)
;   pio device monitor       xem log (115200)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Sinh include/generated_config.h từ config/*.json trước mỗi lần build (một nguồn cấu hình duy nhất).
extra_scripts = pre:tools/pio_generate_config.py

; Dùng C++17 (mặc định của framework là gnu++11); mã nguồn vẫn viết tương thích C++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Isrc
    -Iinclude
    ; Dùng cáp USB thay cho WiFi: bỏ comment dòng sau (log sẽ tắt vì Serial chở giao thức)
    ; -DHEXAPOD_SERIAL_TRANSPORT
